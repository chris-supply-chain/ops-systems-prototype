<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ops OS · factory to door</title>
  <meta name="description" content="Concept prototype: an operating system for making and moving vehicles, from CM production to the customer's door. Every number is mock data.">
  <meta name="theme-color" content="#0B5A40">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B5A40'/%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='none' stroke='%23F4F6F2' stroke-width='1.6'/%3E%3Cpath d='M9 16h13M17.5 11.5 22 16l-4.5 4.5' fill='none' stroke='%23F4C430' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply a stored theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('ops-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage blocked: follow the OS */ }
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>
    <div class="scrim" id="nav-scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>
  <noscript><p style="padding:24px;font-family:system-ui">Ops OS needs JavaScript.</p></noscript>
</body>
</html>
